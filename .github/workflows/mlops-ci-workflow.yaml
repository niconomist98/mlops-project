name: MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e_mlops_workflow:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
      |lfs: true
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name : Run data processing test
      run : |
          python src/data/run_processing.py \
            --input data/raw/house_data.csv \
            --output data/processed/cleaned_house_data.csv

    - name : feature engineering
      run : |
          python src/features/engineer.py   \
            --input data/processed/cleaned_house_data.csv \
            --output data/processed/featured_house_data.csv  \
            --preprocessor models/trained/preprocessor.pkl

    - name : Setup mlflow
      run : |
        docker pull ghcr.io/mlflow/mlflow:latest
        docker run -d -p 5555:5000 --name mlflow-server ghcr.io/mlflow/mlflow:latest  \
          mlflow server \
          --host 0.0.0.0 \
          --backend-store-uri sqlite:///mlflow.db  \
           --default-artifact-root /tmp/mlruns


    - name : train the model
      run : |
          python src/models/train_model.py \
            --config configs/model_config.yaml   \
            --data data/processed/featured_house_data.csv   \
            --models-dir models   \
            --mlflow-tracking-uri http://localhost:5555
    
    - name : close mlflow
      run : |
        docker stop mlflow-server
        docker rm mlflow-server
        docker rmi ghcr.io/mlflow/mlflow:latest
      
    - name : login to docker hub
      uses : docker/login-action@v3
      with : 
        username : ${{vars.DOCKERHUB_USERNAME}}
        password : ${{secrets.DOCKERHUB_TOKEN}}
      
    - name : setup dockerbuildx
      uses : docker/setup-buildx-action@v3
    
    - name : build and push
      uses : docker/build-push-action@v6
      with:
        push : true
        tags : niconomist98/fastapi:${{github.sha}}
        context : .
        file : "Dockerfile"

      