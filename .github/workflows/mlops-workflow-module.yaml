name: MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Data Processing Job ---
  data_processing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run data processing
        run: |
          python src/data/run_processing.py \
            --input data/raw/twcs.csv \
            --output data/processed/twitter_messages_processed_v1.csv

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/twitter_messages_processed_v1.csv

  # --- Feature Engineering Job ---
  feature_engineering:
    runs-on: ubuntu-latest
    needs: data_processing 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature engineering
        run: |
          python src/features/engineer.py \
            --input data/processed/twitter_messages_processed_v1.csv \
            --output data/processed/featured_tws.csv \
            --preprocessor models/trained/preprocessor.pkl

      - name: Upload featured data
        uses: actions/upload-artifact@v4
        with:
          name: featured-data
          path: data/processed/featured_tws.csv

  # --- Model Training Job ---
  model_training:
    runs-on: ubuntu-latest
    needs: feature_engineering 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download featured data
        uses: actions/download-artifact@v4
        with:
          name: featured-data
          path: data/processed/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup MLflow
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5555:5000 --name mlflow-server ghcr.io/mlflow/mlflow:latest \
            mlflow server \
            --host 0.0.0.0 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlruns
        
      - name: Train the model
        run: |
          python src/models/train_model.py \
            --config configs/model_config_classification.yaml \
            --data data/processed/featured_tws.csv \
            --models-dir models \
            --mlflow-tracking-uri http://localhost:5555

      - name: Close MLflow
        if: always()
        run: |
          docker stop mlflow-server
          docker rm mlflow-server
          docker rmi ghcr.io/mlflow/mlflow:latest
      

  build_and_push:
    runs-on: ubuntu-latest
    needs: model_training 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: niconomist98/fastapi:${{github.sha}}
          context: .
          file: "Dockerfile"